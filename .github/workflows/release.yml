name: Release Windows client

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify release version
        run: node scripts/release.mjs verify $env:GITHUB_REF_NAME

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS installer
        env:
          JOKERDECK_UPDATE_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        run: pnpm tauri build --bundles nsis

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installers = @(Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)" }
          node scripts/release.mjs manifest $env:GITHUB_REF_NAME $installers[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release create $env:GITHUB_REF_NAME $installers[0].FullName latest.json --verify-tag --title $env:GITHUB_REF_NAME --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
